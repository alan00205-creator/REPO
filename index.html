<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冰火亂鬥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: full-bleed canvas stage; menus float over the live fight as skewed arcade plaques */
:root{
  --ink:#0c0a14; --ink2:#161222; --panel:rgba(17,14,30,.92); --panel2:rgba(28,23,46,.95);
  --line:#3b3454; --line2:#5a5178; --text:#f4efe6; --dim:#aba4c2;
  --fire:#ff6a2b; --fire2:#ffbe3d; --ice:#56d4ff; --ice2:#dff7ff; --gold:#ffd66b;
  --p1:#ff5a4e; --p2:#4ea8ff; --g1:#5fe07a; --g2:#ffd24e;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-arc:"Bungee","Arial Black",Impact,sans-serif;
  --k:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 40%,#1b1630 0%,var(--ink) 70%)}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vmin,18px);padding-block:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));overflow-y:auto;overflow-x:hidden}
.scr.dim{background:rgba(8,6,14,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scr.solid{background:linear-gradient(180deg,rgba(10,8,18,.93),rgba(14,11,24,.97))}
.scr[hidden]{display:none!important}
.scr.top{justify-content:flex-start}
.scr.top>:first-child{margin-top:auto}.scr.top>:last-child{margin-bottom:auto}

.logoWrap{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
.logo{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(52px,14vmin,138px);line-height:1;letter-spacing:.06em;background:linear-gradient(100deg,#fff6cf 0%,#ffb23d 16%,#ff5a26 38%,#ff4a1c 49.5%,#7fe3ff 50.5%,#35a6ff 70%,#eafcff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #120c18) drop-shadow(0 -2px 0 #120c18) drop-shadow(3px 0 0 #120c18) drop-shadow(-3px 0 0 #120c18) drop-shadow(0 0 26px rgba(255,110,60,.35));text-wrap:balance}
.logoEn{font-family:var(--f-arc);font-size:clamp(11px,2.1vmin,16px);letter-spacing:.42em;color:var(--ice2);opacity:.85;padding-left:.42em}
.tagline{font-size:clamp(12px,2vmin,15px);color:var(--dim);letter-spacing:.08em}
.menu{display:flex;flex-direction:column;gap:clamp(6px,1.3vmin,10px);align-items:stretch;animation:rise .7s .12s cubic-bezier(.2,.9,.3,1.1) both}
.mbtn{position:relative;isolation:isolate;display:flex;align-items:baseline;gap:14px;width:min(430px,84vw);padding:clamp(8px,1.8vmin,13px) 26px;border:0;background:linear-gradient(90deg,rgba(24,20,40,.94),rgba(24,20,40,.62));color:var(--text);font:900 clamp(17px,3.3vmin,24px)/1.15 var(--f-ui);letter-spacing:.14em;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);cursor:pointer;text-align:left;outline:none;transition:transform .12s ease,color .12s}
.mbtn small{font:500 clamp(11px,1.8vmin,13px)/1.3 var(--f-ui);color:var(--dim);letter-spacing:.04em}
.mbtn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--fire),var(--fire2) 45%,var(--ice) 55%,var(--ice2));transform:scaleX(0);transform-origin:left;transition:transform .2s cubic-bezier(.3,.8,.3,1)}
.mbtn::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--fire),var(--ice))}
.mbtn:hover::before,.mbtn:focus-visible::before,.mbtn.sel::before{transform:scaleX(1)}
.mbtn:hover,.mbtn:focus-visible,.mbtn.sel{color:#170f14;transform:translateX(6px)}
.mbtn:hover small,.mbtn:focus-visible small,.mbtn.sel small{color:#2a1a22}
.foot{font-size:12px;color:var(--dim);text-align:center;line-height:1.7;max-width:760px;background:rgba(12,10,20,.72);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.foot kbd,.help kbd,.keyrow kbd{display:inline-block;min-width:1.7em;padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:#1d1830;font:700 11px/1.4 var(--f-ui);color:var(--text);text-align:center}
.corner{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;z-index:3}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(20,17,34,.8);font:700 16px var(--f-ui);cursor:pointer;display:grid;place-items:center}
.ibtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- panels ---------- */
.head{width:min(1100px,100%);display:flex;align-items:center;gap:12px}
.head h2{margin:0;font:900 clamp(20px,3.6vmin,30px)/1.1 var(--f-disp);letter-spacing:.12em}
.head .sp{flex:1}
.back{border:1px solid var(--line2);background:rgba(20,17,34,.85);padding:7px 14px;border-radius:8px;font:700 14px var(--f-ui);cursor:pointer}
.back:focus-visible,.chip:focus-visible,.sArrow:focus-visible,.sCtrl:focus-visible,.go:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slots{width:min(1100px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.4vmin,14px)}
.slots.two{grid-template-columns:repeat(2,minmax(0,1fr));width:min(620px,100%)}
@media (max-width:700px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;transition:border-color .2s,opacity .2s}
.slot.off{opacity:.55}
.slot.off .sPrev canvas{opacity:.25;filter:grayscale(1)}
.sCtrl{width:100%;border:0;border-radius:7px;padding:6px 8px;font:900 14px var(--f-ui);letter-spacing:.08em;cursor:pointer;background:#2a2440;color:var(--text)}
.sCtrl[data-c="p1"]{background:var(--p1);color:#1a0d0d}.sCtrl[data-c="p2"]{background:var(--p2);color:#07131f}
.sCtrl[data-c="g0"]{background:var(--g1);color:#07180c}.sCtrl[data-c="g1"]{background:var(--g2);color:#1d1604}
.sCtrl[data-c="cpu"]{background:#3a3356}.sCtrl:disabled{cursor:default}
.sPrev{position:relative;width:100%;aspect-ratio:1/1;max-height:min(30vh,210px);display:flex;align-items:center;justify-content:center;border-radius:9px;background:radial-gradient(80% 60% at 50% 70%,rgba(255,255,255,.07),rgba(0,0,0,0));overflow:hidden}
.sPrev canvas{height:100%;aspect-ratio:1/1;max-width:100%}
.sArrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;border:0;border-radius:8px;background:rgba(10,8,20,.55);font:900 16px var(--f-ui);cursor:pointer}
.sArrow.l{left:2px}.sArrow.r{right:2px}
.sName{font:900 clamp(18px,3vmin,24px)/1.1 var(--f-disp);letter-spacing:.08em;text-align:center}
.sTrib{font-size:11px;color:var(--dim);letter-spacing:.06em;text-align:center;min-height:1.3em}
.chip{border:1px solid var(--line2);background:#1f1a33;border-radius:999px;padding:4px 12px;font:700 12px var(--f-ui);cursor:pointer;white-space:nowrap}
.chip b{font-weight:900}
.bar{width:min(1100px,100%);display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center}
.bar .grp{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px}
.bar .grp span{color:var(--dim)}
.go{position:relative;isolation:isolate;border:0;padding:10px 34px;font:900 clamp(18px,3vmin,22px)/1 var(--f-ui);letter-spacing:.3em;color:#170f14;background:linear-gradient(90deg,var(--fire),var(--fire2) 48%,var(--ice) 52%,var(--ice2));clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);cursor:pointer;transition:transform .1s}
.go:hover{transform:scale(1.04)}.go:active{transform:scale(.97)}
.notice{min-height:1.2em;font-size:13px;color:var(--gold);text-align:center}

/* help */
.help{width:min(900px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line2);background:#1d1830;border-radius:8px;padding:6px 12px;font:700 13px var(--f-ui);cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--fire),var(--ice));color:#160e14;border-color:transparent}
.hbody{overflow:auto;max-height:min(68vh,calc(100vh - 150px));padding-right:4px;font-size:14px;line-height:1.65}
.hbody h3{margin:4px 0 6px;font:900 18px var(--f-disp);letter-spacing:.08em}
.hbody p{margin:0 0 8px;color:var(--dim);max-width:65ch}
.mv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) 56px;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.mv:last-child{border-bottom:0}
.mv .nm{font-weight:900;letter-spacing:.06em}
.mv .nm small{display:block;font-weight:500;font-size:12px;color:var(--dim);letter-spacing:0}
.mv .mp{font:700 12px var(--f-arc);color:#8fc4ff;text-align:right;font-variant-numeric:tabular-nums}
.mv.ult .nm{color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
.card h4{margin:0 0 6px;font:900 14px var(--f-ui);letter-spacing:.1em}
.keyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:13px}
.keyrow span{color:var(--dim);flex:none;white-space:nowrap}
.keyrow em{font-style:normal;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px;text-align:right;min-width:0}

/* settings */
.set{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-weight:700}
.srow:last-child{border-bottom:0}
.srow .chip{min-width:84px;text-align:center}

/* result */
.resT{margin:0;font:900 clamp(34px,8vmin,72px)/1.1 var(--f-disp);letter-spacing:.1em;text-align:center;background:linear-gradient(100deg,#fff6cf,#ffb23d 40%,#7fe3ff 60%,#eafcff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #120c18);animation:rise .5s cubic-bezier(.2,.9,.3,1.3) both}
.resS{color:var(--dim);font-size:14px;letter-spacing:.1em;text-align:center}
.tbl{width:min(640px,100%);overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--dim);font-weight:700;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
tr.win td{color:var(--gold)}
td .tg{display:inline-block;font:700 10px var(--f-arc);padding:1px 5px;border-radius:4px;margin-right:6px;color:#120c12}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.row .mbtn{width:auto;min-width:150px;justify-content:center;font-size:clamp(15px,2.6vmin,19px);padding:10px 22px}

#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:60;background:rgba(20,16,32,.95);border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:10px;font-weight:700;font-size:14px;pointer-events:none;max-width:90vw;text-align:center}
#pauseBtn{position:absolute;z-index:15;top:0;left:50%;transform:translateX(-50%);width:40px;height:30px;border-radius:9px;border:1px solid var(--line2);background:rgba(14,11,24,.6);font:900 12px var(--f-arc);letter-spacing:1px;cursor:pointer;color:var(--text)}
#rotHint{position:absolute;left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--dim);white-space:nowrap;pointer-events:none;text-align:center}
#rotHint b{font:900 30px/1 var(--f-disp);letter-spacing:.08em;background:linear-gradient(100deg,#ffb23d,#ff5a26 48%,#7fe3ff 52%,#eafcff);-webkit-background-clip:text;background-clip:text;color:transparent}
#rotHint span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:rgba(14,11,24,.8)}

/* ---------- touch controls ---------- */
#touch{position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;pointer-events:none}
#touch[hidden]{display:none}
#touch.below{background:linear-gradient(180deg,#141022,#0c0a14)}
#tStick{position:absolute;left:0;bottom:0;width:46%;height:72%;pointer-events:auto;touch-action:none}
#touch.below #tStick{height:100%;width:50%}
#tBase{position:absolute;width:calc(128px*var(--k));height:calc(128px*var(--k));margin:calc(-64px*var(--k)) 0 0 calc(-64px*var(--k));border-radius:50%;border:2px solid rgba(255,255,255,.22);background:radial-gradient(circle,rgba(255,255,255,.1) 0%,rgba(255,255,255,.03) 60%,rgba(255,255,255,0) 72%);transition:opacity .15s}
#tBase::before{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}
#tBase.on{border-color:rgba(255,255,255,.4)}
#tKnob{position:absolute;left:50%;top:50%;width:calc(56px*var(--k));height:calc(56px*var(--k));margin:calc(-28px*var(--k));border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.2));border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.tHint{position:absolute;left:14px;bottom:6px;font-size:11px;color:rgba(255,255,255,.45);pointer-events:none;white-space:nowrap}
#tPad{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:calc(250px*var(--k));height:calc(214px*var(--k));pointer-events:auto;touch-action:none}
#touch.below #tPad{bottom:max(26px,env(safe-area-inset-bottom));right:14px}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.34);background:rgba(18,14,32,.5);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:900 calc(20px*var(--k))/1 var(--f-ui);padding:0;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .05s,background .1s}
.tb.on{transform:scale(.92);background:rgba(255,255,255,.28)}
.tb i{font:700 calc(9px*var(--k))/1.2 var(--f-arc);font-style:normal;opacity:.8}
.tb b{font-weight:900}
.tb small{font:700 calc(10px*var(--k))/1.1 var(--f-ui);letter-spacing:0}
.tA{width:calc(78px*var(--k));height:calc(78px*var(--k));right:calc(70px*var(--k));bottom:calc(4px*var(--k));border-color:rgba(255,140,90,.7);background:rgba(120,34,16,.45);font-size:calc(26px*var(--k))}
.tJ{width:calc(62px*var(--k));height:calc(62px*var(--k));right:0;bottom:calc(64px*var(--k));border-color:rgba(120,210,255,.7);background:rgba(16,60,100,.45)}
.tD{width:calc(60px*var(--k));height:calc(60px*var(--k));right:calc(158px*var(--k));bottom:0;border-color:rgba(200,200,220,.6)}
.ts{width:calc(54px*var(--k));height:calc(54px*var(--k));font-size:calc(15px*var(--k))}
.ts.s1{right:calc(172px*var(--k));bottom:calc(76px*var(--k))}
.ts.s2{right:calc(110px*var(--k));bottom:calc(100px*var(--k))}
.ts.su{right:calc(48px*var(--k));bottom:calc(140px*var(--k));width:calc(60px*var(--k));height:calc(60px*var(--k));border-color:rgba(255,214,107,.75)}
.ts.no{opacity:.32}
.ts.su.rdy{animation:ultPulse 1s ease-in-out infinite;background:rgba(120,70,10,.5);opacity:1}
@keyframes ultPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,190,61,.0),0 0 14px rgba(255,120,50,.5)}50%{box-shadow:0 0 0 6px rgba(255,190,61,.18),0 0 22px rgba(86,212,255,.6)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (max-height:430px){.foot.hideShort,.tagline{display:none}.logoEn{letter-spacing:.3em}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="冰火亂鬥 遊戲畫面"></canvas>
  <button id="pauseBtn" hidden aria-label="暫停">II</button>
  <div id="rotHint" hidden><b>冰火亂鬥</b><span>⟲ 橫放手機，畫面更大更好打</span></div>

  <div id="touch" hidden>
    <div id="tStick"><div id="tBase"><div id="tKnob"></div></div><div class="tHint">搖桿左右快推兩下＝奔跑</div></div>
    <div id="tPad">
      <button class="tb tA" data-k="atk" aria-label="攻擊">攻</button>
      <button class="tb tJ" data-k="jmp" aria-label="跳躍">跳</button>
      <button class="tb tD" data-k="def" aria-label="防禦">防</button>
      <button class="tb ts s1" data-s="s1"><small>技一</small><i>75</i></button>
      <button class="tb ts s2" data-s="s2"><small>技二</small><i>100</i></button>
      <button class="tb ts su" data-s="ult"><b>絕</b><i>300</i></button>
    </div>
  </div>

  <section id="scrTitle" class="scr">
    <div class="corner"><button class="ibtn nav" id="btnFull" aria-label="全螢幕" title="全螢幕">⛶</button><button class="ibtn nav" id="btnMute" aria-label="音樂開關" title="音樂開關">♪</button></div>
    <div class="logoWrap">
      <h1 class="logo">冰火亂鬥</h1>
      <div class="logoEn">ICE &amp; FIRE BRAWL</div>
      <div class="tagline">致敬《小朋友齊打交二》的同人格鬥小品</div>
    </div>
    <div class="menu">
      <button class="mbtn nav" data-act="vs">對戰模式<small>單挑電腦・雙人同機・四人混戰</small></button>
      <button class="mbtn nav" data-act="chal">闖關模式<small>三關連戰，擊敗闇焰霜</small></button>
      <button class="mbtn nav" data-act="help">招式表<small>搓招指令與操作</small></button>
      <button class="mbtn nav" data-act="settings">設定<small>音樂・音效・難度</small></button>
    </div>
    <div class="foot hideShort" id="titleFoot"></div>
  </section>

  <section id="scrSetup" class="scr solid top" hidden>
    <div class="head"><button class="back nav" data-back>← 返回</button><h2>對戰設定</h2><div class="sp"></div></div>
    <div class="slots" id="slots"></div>
    <div class="bar">
      <div class="grp"><span>場地</span><button class="chip nav" id="stageChip"></button></div>
      <div class="grp"><span>電腦</span><button class="chip nav" id="diffChip"></button></div>
      <div class="grp"><span>道具</span><button class="chip nav" id="itemChip"></button></div>
      <button class="go nav" id="goVs">開打！</button>
    </div>
    <div class="notice" id="setupNote"></div>
  </section>

  <section id="scrChal" class="scr solid top" hidden>
    <div class="head"><button class="back nav" data-back>← 返回</button><h2>闖關模式</h2><div class="sp"></div></div>
    <div class="slots two" id="chalSlots"></div>
    <div class="bar">
      <div class="grp"><span>第一關</span>竹林道場<span>・第二關</span>雪原<span>・最終關</span>火山口</div>

          ${R('移動', K(['↑', '←', '↓', '→']))}
          ${R('攻・跳・防', K(['數字1', '2', '3']))}
          ${R('沒有數字鍵時', K([',', '.', '/']))}
          ${R('快捷：技一・技二・絕', K(['數字4', '5', '6']))}</div>
        <div class="card"><h4>手機</h4>
          ${R('移動', '左半邊任意處拖曳')}
          ${R('奔跑', '搖桿左右快推兩下')}
          ${R('放招', '右側「技／絕」按鈕')}</div>
        <div class="card"><h4>手把</h4>
          ${R('攻・跳・防', 'X・A・B')}
          ${R('技一・技二・絕', 'Y・LB・RB')}
          ${R('暫停', 'Start')}</div>
      </div>
      <h3>共通動作</h3>
      <div class="mv"><div class="nm">連續技<small>攻擊連按三下，第三下擊倒</small></div><div>${K(['攻', '攻', '攻'])}</div><div class="mp"></div></div>
      <div class="mv"><div class="nm">奔跑<small>方向鍵快按兩下；反方向煞車</small></div><div>${K(['→', '→'])}</div><div class="mp"></div></div>
      <div class="mv"><div class="nm">衝刺攻擊・飛身踢<small>奔跑中按攻擊或跳躍後攻擊</small></div><div>${K(['→', '→', '攻'])}</div><div class="mp"></div></div>
      <div class="mv"><div class="nm">受身<small>被打飛時在空中按跳，翻身落地</small></div><div>${K(['跳'])}</div><div class="mp"></div></div>
      <div class="mv"><div class="nm">喝飲料<small>站在牛奶（補血）或汽水（補氣）上按攻擊</small></div><div>${K(['攻'])}</div><div class="mp"></div></div>
      <div class="mv"><div class="nm">冰凍脫困<small>被冰凍時連打任意鍵；冰凍中被打會碎冰重傷</small></div><div>連打</div><div class="mp"></div></div>`;
    } else {
      const d = CHARS[tab];
      h = `<h3>${d.name} <small style="font:500 12px var(--f-ui);color:var(--dim)">${d.tribute}</small></h3><p>${d.desc}</p>` +
        ['s1', 's2', 'ult'].map(k => { const s = d.skills[k]; return `<div class="mv ${k === 'ult' ? 'ult' : ''}"><div class="nm">${k === 'ult' ? '大絕・' : ''}${s.name}<small>${s.desc}</small></div><div>${K(s.cmd)}</div><div class="mp">${s.mp} MP</div></div>`; }).join('') +
        (tab === 'ex' ? '<p style="margin-top:8px">被動「鋼鎧」：HP 條下方的銀條還在時，輕攻擊打不斷他的動作。</p>' : '');
    }
    $('#helpBody').innerHTML = h;
  },
  // --- settings ---
  buildSettings(host = '#setList') {
    const rows = [['音樂', 'music'], ['音效', 'sfx'], ['震動（手機）', 'vibe'], ['道具掉落', 'items']];
    $(host).innerHTML = rows.map(([n, k]) => `<div class="srow"><span>${n}</span><button class="chip nav" data-set="${k}">${settings[k] ? '開' : '關'}</button></div>`).join('') +
      `<div class="srow"><span>電腦難度</span><button class="chip nav" data-set="diff">${DIFF[settings.diff]}</button></div>`;
    $$(host + ' [data-set]').forEach(b => b.onclick = () => {
      const k = b.dataset.set;
      if (k === 'diff') settings.diff = (settings.diff + 1) % 3; else settings[k] = !settings[k];
      saveSettings(); AudioSys.applyVol(); Snd('select'); this.buildSettings(host); this.refreshChips(); this.refreshPauseChips();
      const nb = $(host + ` [data-set="${k}"]`); if (nb) nb.focus();
    });
  },
  refreshPauseChips() { $('#pMusic').textContent = '音樂：' + (settings.music ? '開' : '關'); $('#pSfx').textContent = '音效：' + (settings.sfx ? '開' : '關'); },
  // --- pause ---
  togglePause() {
    if (G.attract || G.phase === 'none') return;
    if (this.cur === 'scrPause') { this.hideAll(); G.paused = false; Keys.pressed.clear(); Touch.reset(); this.enterBattleUI(); Snd('confirm'); }
    else if (!this.cur) { G.paused = true; this.refreshPauseChips(); this.show('scrPause'); Snd('back'); }
  },
  // --- results ---
  statsTable(list) {
    const rows = list.map(f => `<tr class="${G.winners.includes(f) ? 'win' : ''}"><td><span class="tg" style="background:${f.tagCol}">${f.tag}</span>${f.name}</td><td>${Math.round(f.stats.dmg)}</td><td>${Math.round(f.stats.taken)}</td><td>${f.stats.ko}</td><td>${f.stats.combo}</td></tr>`).join('');
    $('#resTable').innerHTML = `<thead><tr><th>角色</th><th>造成傷害</th><th>承受傷害</th><th>擊倒</th><th>最大連擊</th></tr></thead><tbody>${rows}</tbody>`;
  },
  buttons(list) {
    $('#resBtns').innerHTML = list.map((b, i) => `<button class="mbtn nav" data-i="${i}">${b[0]}</button>`).join('');
    $$('#resBtns .mbtn').forEach(el => el.onclick = () => { Snd('confirm'); list[+el.dataset.i][1](); });
  },
  showResult() {
    const w = G.winners; let title = '平手', sub = '同歸於盡';
    if (w.length) {
      const team = w[0].team;
      if (G.teamMode && team < 100 && TEAMS[team]) { title = TEAMS[team].n + ' 勝利'; sub = w.map(f => f.name).join('・'); }
      else { title = w[0].name + ' 勝利'; sub = w[0].human ? w[0].tag + ' 玩家獲勝' : '電腦獲勝'; }
    }
    $('#resTitle').textContent = title; $('#resSub').textContent = sub;
    this.statsTable(G.fighters);
    this.buttons([['再戰一場', () => this.beginBattle(Object.assign({}, this.lastGo, { stage: Setup.stage < 0 ? randi(0, 2) : Setup.stage }))], ['重新選角', () => { this.buildSetup(); this.show('scrSetup'); Music.play('menu'); }], ['回主選單', () => this.toTitle()]]);
    this.show('scrResult'); Music.play('menu');
  },
  showChalResult(lost) {
    const last = Chal.idx === CHAL.length - 1;
    const secs = Math.round(Chal.frames / 60), tm = `${Math.floor(secs / 60)} 分 ${String(secs % 60).padStart(2, '0')} 秒`;
    if (lost) { $('#resTitle').textContent = '挑戰失敗'; $('#resSub').textContent = CHAL[Chal.idx].title + '・' + STAGES[CHAL[Chal.idx].stage].name; }
    else if (last) { $('#resTitle').textContent = '闖關成功'; $('#resSub').textContent = '擊敗闇．焰霜！總戰鬥時間 ' + tm; }
    else { $('#resTitle').textContent = CHAL[Chal.idx].title + ' 突破'; $('#resSub').textContent = '下一關會回復一半的損血與 200 MP'; }
    this.statsTable(G.fighters.filter(f => f.team === 1));
    if (lost) this.buttons([['重試本關', () => { this.hideAll(); Chal.retry(); this.enterBattleUI(); }], ['回主選單', () => this.toTitle()]]);
    else if (last) this.buttons([['再闖一次', () => { this.hideAll(); Chal.begin(Chal.pl[0].cid, Chal.pl[1] ? Chal.pl[1].cid : null); this.enterBattleUI(); }], ['回主選單', () => this.toTitle()]]);
    else this.buttons([['下一關', () => { this.hideAll(); Chal.next(); this.enterBattleUI(); }], ['回主選單', () => this.toTitle()]]);
    this.show('scrResult'); if (lost || last) Music.play('menu');
  },
  tick() {
    if (this.cur === 'scrSetup' || this.cur === 'scrChal') this.drawCards();
    if (this.touchF && !$('#touch').hidden) {
      const f = this.touchF, sk = f.d.skills;
      for (const [cls, k] of [['s1', 's1'], ['s2', 's2'], ['su', 'ult']]) {
        const b = $('#tPad .' + cls), ok = f.mp >= sk[k].mp;
        if (b._ok !== ok) { b._ok = ok; b.classList.toggle('no', !ok); if (cls === 'su') b.classList.toggle('rdy', ok); }
      }
    }
  },
  init() {
    $$('#scrTitle [data-act]').forEach(b => b.onclick = () => {
      AudioSys.init(); Snd('confirm'); const a = b.dataset.act;
      if (a === 'vs') { this.buildSetup(); this.show('scrSetup', 'scrTitle'); }
      else if (a === 'chal') { this.buildChal(); this.show('scrChal', 'scrTitle'); }
      else if (a === 'help') { this.buildHelp(); this.show('scrHelp', 'scrTitle'); }
      else if (a === 'settings') { this.buildSettings(); this.show('scrSettings', 'scrTitle'); }
    });
    $$('[data-back]').forEach(b => b.onclick = () => { Snd('back'); if (this.cur === 'scrHelp' && this.prevScr === 'scrPause') { this.show('scrPause'); return; } this.show('scrTitle'); });
    $('#stageChip').onclick = () => { Setup.stage = Setup.stage + 1 >= STAGES.length ? -1 : Setup.stage + 1; Snd('select'); this.refreshChips(); this.saveSetup(); };
    $('#diffChip').onclick = () => { settings.diff = (settings.diff + 1) % 3; saveSettings(); Snd('select'); this.refreshChips(); };
    $('#itemChip').onclick = () => { settings.items = !settings.items; saveSettings(); Snd('select'); this.refreshChips(); };
    $('#goVs').onclick = () => this.startVs();
    $('#goChal').onclick = () => this.startChal();
    $('#pauseBtn').onclick = () => { AudioSys.init(); this.togglePause(); };
    $$('#scrPause [data-p]').forEach(b => b.onclick = () => {
      const p = b.dataset.p;
      if (p === 'resume') this.togglePause();
      else if (p === 'moves') { this.buildHelp(this.touchF ? this.touchF.cid : 'ctrl'); this.show('scrHelp', 'scrPause'); }
      else if (p === 'restart') { G.paused = false; Snd('confirm'); if (G.mode === 'chal') { this.hideAll(); Chal.retry(); this.enterBattleUI(); } else this.beginBattle(this.lastGo); }
      else if (p === 'quit') { G.paused = false; Snd('back'); this.toTitle(); }
    });
    $('#pMusic').onclick = () => { settings.music = !settings.music; saveSettings(); AudioSys.applyVol(); this.refreshPauseChips(); };
    $('#pSfx').onclick = () => { settings.sfx = !settings.sfx; saveSettings(); AudioSys.applyVol(); this.refreshPauseChips(); };
    $('#btnMute').onclick = () => { AudioSys.init(); settings.music = !settings.music; saveSettings(); AudioSys.applyVol(); $('#btnMute').style.opacity = settings.music ? 1 : .45; };
    $('#btnMute').style.opacity = settings.music ? 1 : .45;
    const fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!fsOk) $('#btnFull').hidden = true;
    $('#btnFull').onclick = () => { const el = document.documentElement; try { if (document.fullscreenElement) document.exitFullscreen(); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => { }); } catch (_) { } };
    $('#titleFoot').innerHTML = Touch.capable
      ? '手機：左半邊拖曳移動，右側按鈕攻擊、跳躍、防禦與放招。建議橫向遊玩。<br>非官方致敬作品；角色、畫面、音樂皆為程式即時繪製與合成。'
      : '1P <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　<kbd>J</kbd> 攻　<kbd>K</kbd> 跳　<kbd>L</kbd> 防　・　搓招：<kbd>防</kbd><kbd>→</kbd><kbd>攻</kbd>　・　<kbd>Esc</kbd> 暫停<br>非官方致敬作品；角色、畫面、音樂皆為程式即時繪製與合成。';
  },
};

// ---------- layout ----------
const app = $('#app');
function layout() {
  const vw = app.clientWidth || innerWidth, vh = app.clientHeight || innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  portraitTouch = Touch.capable && vh > vw * 1.05;
  let cw, ch, left, top;
  const kk = portraitTouch ? clamp(vw / 390, .85, 1.3) : clamp(Math.min(vw, vh) / 400, .78, 1.25);
  if (portraitTouch) { W = 960; cw = vw; ch = vw * H / W; left = 0; top = Math.round(Math.max(56, vh - ch - (214 * kk + 40) - 70)); }
  else { W = Math.round(clamp(H * vw / vh, 960, 1280)); const s = Math.min(vw / W, vh / H); cw = W * s; ch = H * s; left = (vw - cw) / 2; top = (vh - ch) / 2; }
  cssScale = cw / W;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; cv.style.left = left + 'px'; cv.style.top = top + 'px';
  cv.width = Math.max(1, Math.round(cw * DPR)); cv.height = Math.max(1, Math.round(ch * DPR));
  const T = $('#touch');
  T.classList.toggle('below', portraitTouch); T.style.top = portraitTouch ? (top + ch) + 'px' : '0px';
  T.style.setProperty('--k', kk.toFixed(3));
  $('#pauseBtn').style.top = (portraitTouch ? Math.max(6, top - 40) : top + Math.round(66 * cssScale)) + 'px';
  $('#rotHint').style.top = (portraitTouch ? Math.max(8, top / 2 - 30) : 8) + 'px';
  Stage.buildBG();
  for (const f of G.fighters) f.x = clamp(f.x, 18, W - 18);
  Touch.placeBase();
  MAXP = Touch.capable ? 320 : 520;
}

// ---------- boot ----------
let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now; if (dt > .1) dt = .1;
  if (!G.paused) { acc += dt * (G.slow > 0 ? .32 : 1); let n = 0; while (acc >= STEP && n < 4) { G.update(); acc -= STEP; n++; } if (n === 4) acc = 0; }
  Pads.poll();
  try { render(); } catch (e) { console.error(e); }
  UI.tick();
}
function boot() {
  Touch.init(); UI.init();
  addEventListener('keydown', e => {
    if (GAME_CODES.has(e.code) || e.code.startsWith('Arrow')) e.preventDefault();
    AudioSys.init();
    if (!e.repeat) Keys.pressed.add(e.code);
    Keys.down.add(e.code);
    UI.onKey(e);
  }, { passive: false });
  addEventListener('keyup', e => Keys.down.delete(e.code));
  addEventListener('blur', () => { Keys.down.clear(); Touch.reset(); });
  addEventListener('pointerdown', () => { AudioSys.init(); if (!Music.want) Music.play('menu'); }, { passive: true });
  addEventListener('keydown', () => { if (!Music.want) Music.play('menu'); });
  app.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden && !UI.cur && !G.attract && G.phase !== 'end') UI.togglePause(); });
  addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  layout();
  UI.show('scrTitle'); UI.startAttract(); Music.want = 'menu';
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('900 40px "Noto Serif TC"', '冰火亂鬥準備開打平手突破闖關成功下一波天墜赤凰掌千里冰封百裂拳'), document.fonts.load('400 20px "Bungee"', 'K.O.FIGHTREADY1P2PCPU'), document.fonts.load('900 13px "Noto Sans TC"', '焰霜鋼鎧凜冬阿烈連擊破防甲不足奶汽')]).catch(() => { });
  requestAnimationFrame(frame);
}
function start() { boot(); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) try { window.claude.hot.snapshot(() => ({ setup: Setup, chal: ChalSel })); } catch (_) { }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
</script>
</body>
